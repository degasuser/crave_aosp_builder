name: Read Crave build diagnostics
on:
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read Crave log command options
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/accupara/crave/releases/download/0.2-7183/crave-0.2-7183-linux-amd64.bin -o "$RUNNER_TEMP/crave"
          chmod +x "$RUNNER_TEMP/crave"
          umask 077
          envsubst < crave.conf.sample > "$RUNNER_TEMP/crave-diagnostics.conf"
          "$RUNNER_TEMP/crave" -n -c "$RUNNER_TEMP/crave-diagnostics.conf" getlog --help
          "$RUNNER_TEMP/crave" -n -c "$RUNNER_TEMP/crave-diagnostics.conf" list
